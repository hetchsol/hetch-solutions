<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hetch Quotes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.png">
<style>
:root{
  --navy:#1f4e8c; --teal:#2bb3a3; --teal-ink:#1d8f82;
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#f8fafc; --ink:#1b2430; --muted:#5f6b7a;
  --line:#dde3ea; --focus:#2bb3a3; --danger:#c0392b; --warn-bg:#fff7e0; --warn-ink:#7a5b00;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161d; --panel:#1a212b; --panel-2:#202834; --ink:#e6ebf1; --muted:#9aa6b4;
    --line:#2d3746; --warn-bg:#3a3214; --warn-ink:#f0d68a; --navy:#6f9fe0; --teal-ink:#4fd1c1;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#11161d; --panel:#1a212b; --panel-2:#202834; --ink:#e6ebf1; --muted:#9aa6b4;
  --line:#2d3746; --warn-bg:#3a3214; --warn-ink:#f0d68a; --navy:#6f9fe0; --teal-ink:#4fd1c1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap}
.brand img{height:30px;background:#fff;border-radius:6px;padding:2px}
.topbar .spacer{flex:1}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1420}}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.icon{padding:3px 7px;min-width:28px;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;color:var(--ink);font-size:14px}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--focus) 45%,transparent);border-color:var(--focus)}
input.num{text-align:right}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}

/* ---------- cards ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.hint{font-size:12px;color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:0 0 10px}

/* ---------- dashboard ---------- */
.dash-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.dash-head h1{margin:0;font-size:22px;flex:1;min-width:180px}
.dash-head input{max-width:280px}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--panel-2)}
table.list td.r,table.list th.r{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.standard{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal-ink)}
.badge.proforma{background:color-mix(in srgb,#e08a00 20%,transparent);color:#b36b00}
:root[data-theme="dark"] .badge.proforma{color:#f2b04a}
.badge.project{background:color-mix(in srgb,var(--navy) 16%,transparent);color:var(--navy)}
select.status{width:auto;padding:3px 6px;font-size:12px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
@media (max-width:760px){ .hide-sm{display:none} }

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border-radius:14px;max-width:720px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:20px}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 6px}
@media (max-width:600px){.type-cards{grid-template-columns:1fr}}
.type-card{border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--panel-2);text-align:left}
.type-card:hover,.type-card:focus{border-color:var(--teal);outline:none}
.type-card h4{margin:0 0 6px;font-size:16px}
.type-card ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.type-card .eg{margin-top:10px;font-size:12px;color:var(--muted)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ---------- editor ---------- */
.ed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:51px;z-index:15}
.ed-bar .qno{font-weight:700;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#0d1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0d1420}}
.ed-tabs{display:none}
.editor{display:grid;grid-template-columns:minmax(460px,640px) 1fr;gap:16px;padding:16px;align-items:start}
.ed-form{min-width:0}
.ed-preview{position:sticky;top:112px;max-height:calc(100vh - 128px);overflow-y:auto;overflow-x:hidden;background:#7d8794;border-radius:12px;padding:16px}
@media (max-width:1100px){
  .editor{grid-template-columns:1fr}
  .ed-tabs{display:inline-flex}
  .editor[data-tab="edit"] .ed-preview{display:none}
  .editor[data-tab="preview"] .ed-form{display:none}
  .ed-preview{position:static;max-height:none}
}
.preview-scale{transform-origin:top left}

/* item rows */
.items-std{width:100%;border-collapse:collapse}
.items-std th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px;font-weight:600}
.items-std td{padding:4px 3px;vertical-align:top;border-top:1px solid var(--line)}
.items-std .n{width:34px;color:var(--muted);padding-top:10px;font-size:12px}
.items-std .q{width:62px}.items-std .p{width:96px}.items-std .x{width:92px;text-align:right;padding-top:10px;font-variant-numeric:tabular-nums}
.items-std .a{width:82px;white-space:nowrap;text-align:right}
details.more summary{font-size:12px;color:var(--muted);cursor:pointer;margin-top:3px}
details.more textarea{margin-top:4px;min-height:48px;font-size:13px}
.section{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;background:var(--panel-2)}
.section-head{display:flex;gap:6px;align-items:end;margin-bottom:8px}
.section-head label{flex:1}
.section-total{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.pitem{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel)}
.pitem .row1{display:grid;grid-template-columns:130px 1fr auto;gap:6px;align-items:end}
.pitem .row2{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.pitem .row3{display:grid;grid-template-columns:90px 130px 1fr;gap:6px;margin-top:6px;align-items:end}
.pitem .ext{text-align:right;font-weight:600;padding-bottom:6px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.pitem .row1{grid-template-columns:1fr auto}.pitem .row1 .code{grid-column:1/-1}}
.totals-box{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.totals-box .big{font-weight:700;font-size:16px}
.list-ed .li{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.list-ed .li .k{width:22px;color:var(--muted);padding-top:7px;font-size:12px;text-align:right}
.list-ed .li textarea{min-height:34px;height:36px}
.note-row{display:grid;grid-template-columns:1fr 1.6fr 110px auto;gap:6px;margin-bottom:6px;align-items:start}
@media (max-width:640px){.note-row{grid-template-columns:1fr 1fr}}
.doc.pdf{width:auto;min-height:0;padding:0;box-shadow:none}
.html2pdf__container{left:0!important;right:auto!important;margin:0!important}
.share-step{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--panel-2)}
.share-step h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.share-step .num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;align-items:center;justify-content:center}
.share-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.share-row label{flex:1;min-width:180px}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:380px}
.login-logo{display:block;height:96px;margin:0 auto 16px;background:#fff;border-radius:10px;padding:6px}
.idle-warn{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;background:#7a5b00;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:14px;max-width:92vw;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13.5px;max-width:90vw}

/* ---------- printable document (always light) ---------- */
.doc{width:210mm;min-height:297mm;background:#fff;color:#000;padding:10mm 11mm;font-family:Calibri,"Carlito","Segoe UI",Arial,sans-serif;font-size:10.5pt;line-height:1.3;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.doc *{color:inherit}
.doc .d-head{display:flex;justify-content:space-between;align-items:flex-start}
.doc .d-logo{width:46mm;height:auto}
.doc .d-contact{text-align:left;font-size:10pt;line-height:1.5;min-width:62mm}
.doc .d-titlerow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin:3mm 0 2mm}
.doc .d-title{font-size:24pt;font-weight:700;color:#33CCCC;letter-spacing:.02em}
.doc .d-tpin{text-align:right;font-weight:700}
.doc .bar{background:#737F8F;color:#fff;font-weight:700;padding:1.2mm 2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .bar.two{display:grid;grid-template-columns:1fr 1fr}
.doc .bar.thin{padding:0;height:2.2mm}
.doc .parties{display:grid;grid-template-columns:1fr 1fr;gap:6mm;padding:2mm 2mm 3mm}
.doc .parties div div{min-height:1.3em}
.doc table{width:100%;border-collapse:collapse}
.doc table.meta th{background:#737F8F;color:#fff;font-weight:700;text-align:left;padding:1.2mm 2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc table.meta td{color:#33CCCC;font-weight:700;padding:1.2mm 2mm}
.doc .intro{margin:3mm 0}
.doc table.items th{background:#737F8F;color:#fff;font-weight:700;text-align:left;padding:1.2mm 2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;vertical-align:bottom}
.doc table.items td{padding:1.2mm 2mm;border-bottom:.2mm solid #d6dbe1;vertical-align:top}
.doc table.items tr{break-inside:avoid}
.doc table.items .r{text-align:right;white-space:nowrap}
.doc table.items .c{text-align:center}
.doc table.items .sec td{background:#eef1f4;font-weight:700;font-size:9.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc table.items .tot td{font-weight:700;border-bottom:0}
.doc .det{font-size:9pt;color:#333;white-space:pre-wrap;margin-top:.8mm}
.doc .ttl{font-weight:700}
.doc .bottom{display:grid;grid-template-columns:1fr 72mm;gap:8mm;margin-top:4mm;break-inside:avoid}
.doc .bank h4,.doc .block h4{margin:0 0 1.5mm;font-size:10.5pt}
.doc .bank table td{padding:.4mm 0;vertical-align:top}
.doc .bank table td:first-child{width:34mm}
.doc table.totals td{padding:1.2mm 2mm}
.doc table.totals td:first-child{font-weight:700}
.doc table.totals td.r{text-align:right;white-space:nowrap}
.doc table.totals tr.grand td{background:#737F8F;color:#fff;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .block{margin-top:5mm;break-inside:avoid-page}
.doc .terms{font-size:9pt;line-height:1.35}
.doc .terms div{margin-bottom:.6mm}
.doc .rule{border-top:.3mm solid #737F8F;margin:5mm 0 3mm}
.doc table.notes td{padding:1.2mm 2mm;border-bottom:.2mm solid #d6dbe1;vertical-align:top;font-weight:700;font-size:9.5pt}
.doc table.notes td.r{text-align:right;white-space:nowrap}

#printArea{display:none}
@page{size:A4;margin:10mm 11mm}
@media print{
  body{background:#fff}
  #app,.toast,.modal-bg{display:none!important}
  #printArea{display:block}
  #printArea .doc{box-shadow:none;margin:0;min-height:auto;width:auto;padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script src="config.js" onerror="void 0"></script>

/* ---------- utils ---------- */
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; }
function money(v) { return num(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pad(n, w) { return String(n).padStart(w, '0'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function parseISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmtDate(s) { const d = typeof s === 'string' ? parseISO(s) : s; return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : ''; }
function addDays(s, n) { const d = parseISO(s); if (!d) return null; d.setDate(d.getDate() + num(n)); return d; }
function getPath(o, path) { return path.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, path, v) { const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }
function $(sel, root = document) { return root.querySelector(sel); }
function $all(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

    if (!P.some(p => p.name === 'Chibole Kashiwa')) P.push({ id: uid(), name: 'Chibole Kashiwa', position: 'Sales & Marketing', cell: '', email: '' });
    if (!P.some(p => p.id === s.settings.defaultProfileId)) s.settings.defaultProfileId = P[0]?.id || null;
    s.settings.peopleV2 = true;
  }
  // one-time: Chibole's position
  if (!s.settings.peopleV3) {
    (s.settings.profiles || []).forEach(p => { if (p.name === 'Chibole Kashiwa' && !p.position) p.position = 'Sales & Marketing'; });
    s.settings.peopleV3 = true;
  }

  for (const k of Object.keys(d)) if (s.settings[k] === undefined) s.settings[k] = d[k];
  for (const t of ['standard', 'project']) s.settings.types[t] = Object.assign({}, d.types[t], s.settings.types[t] || {});
  // v1 had a number series per type; merge into one shared series
  const N = s.settings.numbering;
  if (N.nextSeq === undefined || N.nextSeq === '') {

    N.nextSeq = olds.length ? Math.max(...olds) : d.numbering.nextSeq;
  }
  for (const t of ['standard', 'project']) delete s.settings.types[t].nextSeq;
  if (N.pfPrefix === undefined) N.pfPrefix = d.numbering.pfPrefix;
  if (N.pfNextSeq === undefined) N.pfNextSeq = d.numbering.pfNextSeq;
  s.settings.proforma = Object.assign({}, d.proforma, s.settings.proforma || {});
  if (!s.settings.defaultProfileId && s.settings.profiles[0]) s.settings.defaultProfileId = s.settings.profiles[0].id;
  s.quotes = (s.quotes || []).map(normaliseQuote);

}

/* ---------- quote model ---------- */
function blankItem() { return { id: uid(), code: '', title: '', details: '', qty: 1, price: '' }; }
function normaliseQuote(q) {

  q.sections.forEach(s => { s.id = s.id || uid(); s.items = (s.items || []).map(i => Object.assign(blankItem(), i)); });

}
function newQuote(type, seq, kind) {

    || S.profiles.find(p => p.id === S.defaultProfileId) || S.profiles[0] || {};

    id: uid(), type, status: 'draft', created: Date.now(), updated: Date.now(),
    seq, numberAuto: true, number: '',

    client: {}, preparedBy: { name: prof.name || '', position: prof.position || '', cell: prof.cell || '', email: prof.email || '' },
    sections: type === 'project'
      ? (T.groups && T.groups.length ? T.groups : ['']).map(n => ({ id: uid(), name: n, items: [blankItem()] }))

    discountPct: 0, taxPct: 0,

}
function applyProformaDefaults(q) {

}
function takePfSeq() { const N = state.settings.numbering; const n = num(N.pfNextSeq) || 1; N.pfNextSeq = n + 1; return n; }
const STATUSES = { quote: ['draft', 'sent', 'accepted', 'lost'], proforma: ['draft', 'sent', 'paid', 'cancelled'] };
function statusOptions(q) {
  let list = STATUSES[q.kind] || STATUSES.quote;
  if (!list.includes(q.status)) list = [q.status, ...list];
  return list.map(s => `<option value="${s}" ${q.status === s ? 'selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('');
}
const isPF = q => q.kind === 'proforma';
const docName = q => isPF(q) ? 'Proforma invoice' : 'Quotation';
function takeSeq() { const N = state.settings.numbering; const n = num(N.nextSeq) || 1; N.nextSeq = n + 1; return n; }
function clientSuffix(name) { return (name || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 3); }
const CURRENCIES = [
  ['ZMW', 'Zambian Kwacha'], ['USD', 'US Dollar'], ['ZAR', 'South African Rand'],
  ['EUR', 'Euro'], ['GBP', 'British Pound'], ['CNY', 'Chinese Yuan'], ['BWP', 'Botswana Pula']
];
function currencySelect(value, attr) {

  if (value && !list.some(c => c[0] === value)) list.unshift([value, '']);
  return `<select ${attr}>${list.map(([c, n]) => `<option value="${c}" ${c === value ? 'selected' : ''}>${c}${n ? ' - ' + n : ''}</option>`).join('')}</select>`;
}
// file name for saved/printed quotes, e.g. "HSE2658-dal Dali Machinery Zambia Limited"
function quoteFileBase(q) {
  return ((quoteNo(q) || 'Quote') + (q.client.company ? ' ' + q.client.company : ''))
    .replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120);
}
// keep the open quote's number as the page title, so any "save" offers it as the file name
function syncTitle() {

}
function quoteNo(q) {

function fitPreview() {
  const pane = $('#previewPane'), sc = $('#previewScale');
  if (!pane || !sc || !sc.firstElementChild) return;
  const docW = sc.firstElementChild.offsetWidth;
  const avail = pane.clientWidth - 32;
  if (avail <= 0 || !docW) return;
  const s = Math.min(1, avail / docW);
  sc.style.transform = `scale(${s})`;
  sc.style.height = (sc.firstElementChild.offsetHeight * s) + 'px';
  sc.style.width = (docW * s) + 'px';
}
window.addEventListener('resize', () => { if (view.name === 'edit') fitPreview(); });
document.addEventListener('load', e => { if (e.target.tagName === 'IMG' && view.name === 'edit') fitPreview(); }, true);

/* ---------- mutations ---------- */
function touch(q) { q.updated = Date.now(); if (CLOUD) dirtyQuotes.add(q.id); save(); }
function saveSettings() { if (CLOUD) dirtySettings = true; save(); }
function rerenderEditor() {
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function findItem(q, id) { for (let si = 0; si < q.sections.length; si++) { const ii = q.sections[si].items.findIndex(i => i.id === id); if (ii >= 0) return { si, ii }; } return null; }

function moveItem(q, id, dir) {
  if (q.type === 'project') {
    const { si, ii } = findItem(q, id); const arr = q.sections[si].items; const j = ii + dir;
    if (j < 0 || j >= arr.length) return; [arr[ii], arr[j]] = [arr[j], arr[ii]]; return;
  }
  // standard: move within the flat list, crossing hidden groups if needed
  const flat = allItems(q); const k = flat.findIndex(x => x.it.id === id); const tk = k + dir;
  if (tk < 0 || tk >= flat.length) return;
  const from = flat[k], to = flat[tk];
  q.sections[from.si].items.splice(from.ii, 1);
  const insertAt = (from.si === to.si) ? to.ii : (dir < 0 ? to.ii : to.ii + 1);
  q.sections[to.si].items.splice(insertAt, 0, from.it);
}
async function duplicateQuote(id) {
  const src = state.quotes.find(q => q.id === id); if (!src) return;
  let seq; try { seq = await allocSeq(src.kind); } catch (e) { toast(seqErrorText(src.kind)); return; }
  const q = stripPrivate(src); delete q.importedFrom;
  q.id = uid(); q.created = q.updated = Date.now(); q.status = 'draft'; q.date = todayISO();
  q.seq = seq; q.numberAuto = true; q.number = '';
  q.sections.forEach(s => { s.id = uid(); s.items.forEach(i => i.id = uid()); });
  normaliseQuote(q); state.quotes.push(q); if (CLOUD) dirtyQuotes.add(q.id); save(true); go('edit', q.id); toast('Duplicated as ' + quoteNo(q));
}
async function createProforma(id) {
  const src = state.quotes.find(q => q.id === id); if (!src) return;
  let seq; try { seq = await allocSeq('proforma'); } catch (e) { toast(seqErrorText('proforma')); return; }
  const p = stripPrivate(src);
  delete p.importedFrom;
  p.id = uid(); p.created = p.updated = Date.now(); p.date = todayISO();
  p.seq = seq; p.numberAuto = true; p.number = '';
  p.quoteId = src.id; p.quoteRef = quoteNo(src);
  applyProformaDefaults(p);
  p.sections.forEach(s => { s.id = uid(); s.items.forEach(i => i.id = uid()); });
  normaliseQuote(p); state.quotes.push(p); if (CLOUD) dirtyQuotes.add(p.id); save(true); go('edit', p.id);
  toast('Proforma ' + quoteNo(p) + ' created from quote ' + p.quoteRef);
}
function seqErrorText(kind) {
  if (kind === 'proforma' && CLOUD && !pfReady) return 'Proforma numbering is not set up in the database yet. Run supabase-proforma.sql in Supabase (SQL Editor), then reload.';
  return 'Could not get a ' + (kind === 'proforma' ? 'proforma' : 'quote') + ' number. Check your internet connection.';
}
function printQuote() {
  const q = current(); if (!q) return;
  $('#printArea').innerHTML = renderDoc(q);
  document.title = quoteFileBase(q);   // the browser's "Save as PDF" uses this as the file name
  const done = () => { $('#printArea').innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  // wait for logo to be ready before printing
  const img = $('#printArea img');
  const doPrint = () => setTimeout(() => window.print(), 50);
  if (img && !img.complete) { img.onload = doPrint; img.onerror = doPrint; } else doPrint();
}

/* ---------- PDF + sharing ---------- */
const PDF_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
let pdfLibPromise = null;
function loadPdfLib() {
  if (window.html2pdf) return Promise.resolve();
  if (!pdfLibPromise) pdfLibPromise = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = PDF_LIB;
    sc.onload = () => res(); sc.onerror = () => { pdfLibPromise = null; rej(new Error('offline')); };
    document.head.appendChild(sc);
  });
  return pdfLibPromise;
}
function pdfFileName(q) { return quoteFileBase(q) + '.pdf'; }
async function makePdfBlob(q) {
  await loadPdfLib();
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff';
  host.innerHTML = renderDoc(q).replace('<div class="doc">', '<div class="doc pdf">');
  document.body.appendChild(host);
  try {
    await Promise.all($all('img', host).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    return await html2pdf().set({
      margin: [10, 11, 10, 11], filename: pdfFileName(q),
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.bottom', '.bank', '.terms div'] }
    }).from(host.firstElementChild).outputPdf('blob');
  } finally { host.remove(); }
}
function intlPhone(raw) {
  const d = String(raw || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('0')) return '260' + d.slice(1);   // Zambian local number
  return d;
}

/* ---------- backup ---------- */
function exportBackup() {
  state.settings.lastBackup = Date.now(); saveSettings();
  const blob = new Blob([JSON.stringify(stripPrivate(state), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `hetch-quotes-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup downloaded'); if (view.name === 'dash') render();
}
function importBackup() {
  const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
  f.onchange = () => {
    const file = f.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let data; try { data = JSON.parse(r.result); } catch (e) { toast('That file is not a valid backup.'); return; }
      if (!data || !Array.isArray(data.quotes)) { toast('That file is not a Hetch Quotes backup.'); return; }
      // a file with quotes but no settings (e.g. converted old quotes) only adds quotes; settings stay as they are
      const quotesOnly = !data.settings;
      const n = data.quotes.length;
      const mergeQuotes = () => {
        const B = prepareState({ settings: quotesOnly ? clone(state.settings) : data.settings, quotes: data.quotes });
        const keepSeq = num(state.settings.numbering.nextSeq);
        if (!quotesOnly) { state.settings = B.settings; if (CLOUD) dirtySettings = true; }
        B.quotes.forEach(q => {
          const i = state.quotes.findIndex(x => x.id === q.id);
          if (i >= 0) { q._version = state.quotes[i]._version; state.quotes[i] = q; } else { delete q._version; state.quotes.push(q); }
          if (CLOUD) dirtyQuotes.add(q.id);
        });
        const keepPf = num(state.settings.numbering.pfNextSeq);
        const next = Math.max(keepSeq, quotesOnly ? 0 : num(B.settings.numbering.nextSeq), ...B.quotes.map(q => q.numberAuto && !isPF(q) ? num(q.seq) + 1 : 0));
        const nextPf = Math.max(keepPf, quotesOnly ? 0 : num(B.settings.numbering.pfNextSeq), ...B.quotes.map(q => q.numberAuto && isPF(q) ? num(q.seq) + 1 : 0));
        state.settings.numbering.nextSeq = next; state.settings.numbering.pfNextSeq = nextPf || '';
        if (CLOUD) { setCloudSeq(next); if (pfReady && nextPf > keepPf) setCloudPfSeq(nextPf); } else saveSettings();
        save(true); go('dash'); toast(`Imported ${B.quotes.length} quotes`);
      };
      if (quotesOnly) {
        confirmBox('Import quotes?', `This adds ${n} quotes to ${CLOUD ? 'the online quotes' : 'this app'}. Importing the same file again replaces those quotes instead of duplicating them. Your settings are not changed.`, 'Import', mergeQuotes);
        return;
      }
      if (CLOUD) {
        confirmBox('Import backup?', `This adds the ${n} quotes in the backup to the online quotes (a quote that already exists online is replaced by the backup's copy) and replaces the settings.`, 'Import', mergeQuotes);
        return;
      }
      confirmBox('Restore backup?', `This replaces everything currently in the app with the backup (${data.quotes.length} quotes). Download a backup of the current data first if you might need it.`, 'Replace with backup', () => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); state = load(); }
        catch (e) { data.quotes = data.quotes.map(normaliseQuote); state = data; }
        save(true); go('dash'); toast('Backup restored');
      }, true);
    };
    r.readAsText(file);
  };
  f.click();
}

      return;

    if (d.addsec !== undefined) { q.sections.push({ id: uid(), name: '', items: [blankItem()] }); touch(q); rerenderEditor(); return; }
    if (d.rmsec) {
      const i = q.sections.findIndex(s => s.id === d.rmsec); const s = q.sections[i];
      const doIt = () => { q.sections.splice(i, 1); touch(q); rerenderEditor(); };
      if (s.items.some(it => it.title || num(it.price))) confirmBox('Remove group?', `Remove group “${esc(s.name || 'Group ' + (i + 1))}” and its ${s.items.length} item(s)?`, 'Remove', doIt, true); else doIt();
      return;
    }
    if (d.mvsec) { const i = q.sections.findIndex(s => s.id === d.mvsec), j = i + +d.dir; if (j >= 0 && j < q.sections.length) { [q.sections[i], q.sections[j]] = [q.sections[j], q.sections[i]]; touch(q); rerenderEditor(); } return; }
    if (d.ladd) { const arr = getPath(q, d.ladd); arr.push(d.ladd === 'notes' ? { label: '', description: '', price: '' } : ''); touch(q); rerenderEditor(); return; }

    if (d.lmv) { const arr = getPath(q, d.lmv), i = +d.i, j = i + +d.dir; if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; touch(q); rerenderEditor(); } return; }
    if (d.loaddef) { q[d.loaddef] = clone(state.settings.types.project[d.loaddef] || []); touch(q); rerenderEditor(); return; }

    if (d.sladd) { const arr = getPath(S, d.sladd) || []; if (!getPath(S, d.sladd)) setPath(S, d.sladd, arr); arr.push(d.sladd.endsWith('notes') && !d.sladd.endsWith('additionalNotes') ? { label: '', description: '', price: '' } : ''); saveSettings(); rerenderEditor(); return; }

    if (d.slmv) { const arr = getPath(S, d.slmv), i = +d.i, j = i + +d.dir; if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; saveSettings(); rerenderEditor(); } return; }
  }

/* ---------- online storage (Supabase) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
function stripPrivate(o) { return JSON.parse(JSON.stringify(o, (k, v) => k.startsWith('_') ? undefined : v)); }
function rowToQuote(r) {
  return normaliseQuote(Object.assign(r.data || {}, { id: r.id, _version: r.version, _by: r.updated_by, updated: Date.parse(r.updated_at) || Date.now() }));
}
async function loadCloud() {
  const [st, qs, seq] = await Promise.all([
    sb.from('hq_settings').select('data').eq('id', 1).maybeSingle(),
    sb.from('hq_quotes').select('id,data,version,updated_at,updated_by'),
    sb.rpc('hq_peek_seq')
  ]);
  const err = st.error || qs.error || seq.error; if (err) throw err;
  state = prepareState({ settings: st.data ? st.data.data : null, quotes: [] });
  state.quotes = qs.data.map(rowToQuote);
  state.settings.numbering.nextSeq = seq.data;
  // proforma counter (needs supabase-proforma.sql); the app still works without it
  const pfc = await sb.rpc('hq_peek_counter', { counter_name: 'proforma' });
  pfReady = !pfc.error;
  state.settings.numbering.pfNextSeq = pfc.error ? '' : pfc.data;
  if (!st.data) { dirtySettings = true; flushCloud(); }   // first run: store default settings
}
let lastRefresh = 0;
async function refreshQuotes(force) {
  if (!CLOUD || !sb || !state || (!force && Date.now() - lastRefresh < 4000)) return;
  lastRefresh = Date.now();
  const { data, error } = await sb.from('hq_quotes').select('id,data,version,updated_at,updated_by');
  if (error || !state) return;
  const local = new Map(state.quotes.map(q => [q.id, q]));
  const fresh = data.filter(r => !deletedQuotes.has(r.id)).map(r => {
    const mine = local.get(r.id);
    return (mine && (dirtyQuotes.has(r.id) || r.id === view.id)) ? mine : rowToQuote(r);
  });
  state.quotes.forEach(q => { if (!q._version && !fresh.some(f => f.id === q.id)) fresh.push(q); });
  state.quotes = fresh;
  if (view.name === 'dash' && !(document.activeElement && document.activeElement.id === 'search')) render();
}
async function flushCloud() {
  if (!sb || !state) return;
  if (flushing) { flushAgain = true; return; }
  flushing = true; clearTimeout(retryTimer); setSaveState('Saving…');
  try {
    if (dirtySettings) {
      dirtySettings = false;
      const { error } = await sb.from('hq_settings').upsert({ id: 1, data: stripPrivate(state.settings) });
      if (error) { dirtySettings = true; throw error; }
    }
    for (const id of [...deletedQuotes]) {
      const { error } = await sb.from('hq_quotes').delete().eq('id', id);
      if (error) throw error;
      deletedQuotes.delete(id);
    }
    for (const id of [...dirtyQuotes]) {
      dirtyQuotes.delete(id);
      const q = state.quotes.find(x => x.id === id); if (!q) continue;
      const data = stripPrivate(q);
      if (!q._version) {
        const { data: row, error } = await sb.from('hq_quotes').insert({ id, data, version: 1 }).select('version,updated_by').single();
        if (error) { dirtyQuotes.add(id); throw error; }
        q._version = row.version; q._by = row.updated_by;
      } else {
        const { data: rows, error } = await sb.from('hq_quotes').update({ data, version: q._version + 1 })
          .eq('id', id).eq('version', q._version).select('version,updated_by');
        if (error) { dirtyQuotes.add(id); throw error; }
        if (!rows.length) { showConflict(q); continue; }
        q._version = rows[0].version; q._by = rows[0].updated_by;
      }
    }
    setSaveState(dirtyQuotes.size || dirtySettings ? 'Saving…' : 'All changes saved');
  } catch (e) {
    console.error(e);
    setSaveState('⚠ Not saved yet. Retrying…');
    retryTimer = setTimeout(flushCloud, 8000);
  } finally {
    flushing = false;
    if (flushAgain) { flushAgain = false; flushCloud(); }
  }
}
function showConflict(q) {
  if (conflictOpen) return; conflictOpen = true;
  openModal(`<h2>Someone else changed this quote</h2>
    <p><strong>${esc(quoteNo(q))}</strong> was saved by another person while you were editing it. Which version do you want to keep?</p>
    <div class="actions"><button class="btn" data-theirs>Load their version</button><button class="btn primary" data-mine>Keep my version</button></div>`, m => {
    const fetchRow = () => sb.from('hq_quotes').select('id,data,version,updated_at,updated_by').eq('id', q.id).maybeSingle();
    $('[data-mine]', m).onclick = async () => {
      const { data: row } = await fetchRow();
      q._version = row ? row.version : undefined; dirtyQuotes.add(q.id);
      conflictOpen = false; closeModal(); flushCloud();
    };
    $('[data-theirs]', m).onclick = async () => {
      const { data: row } = await fetchRow();
      const i = state.quotes.findIndex(x => x.id === q.id);
      if (row) state.quotes[i] = rowToQuote(row); else state.quotes.splice(i, 1);
      conflictOpen = false; closeModal();
      if (view.id === q.id && !row) go('dash'); else rerenderEditor();
    };
  });
}
async function allocSeq(kind) {
  if (kind === 'proforma') {
    if (!CLOUD) return takePfSeq();
    const { data, error } = await sb.rpc('hq_take_counter', { counter_name: 'proforma' });
    if (error) { pfReady = false; throw error; }
    pfReady = true; state.settings.numbering.pfNextSeq = data + 1;
    return data;
  }
  if (!CLOUD) return takeSeq();
  const { data, error } = await sb.rpc('hq_take_seq');
  if (error) throw error;
  state.settings.numbering.nextSeq = data + 1;
  return data;
}
let pfSeqTimer;
function setCloudPfSeq(v) {
  clearTimeout(pfSeqTimer);
  pfSeqTimer = setTimeout(async () => {
    const n = num(v); if (!n) return;
    const { error } = await sb.rpc('hq_set_counter', { counter_name: 'proforma', n });
    setSaveState(error ? '⚠ Could not update the next proforma number' : 'All changes saved');
  }, 600);
}
let seqTimer;
function setCloudSeq(v) {
  clearTimeout(seqTimer);
  seqTimer = setTimeout(async () => {
    const n = num(v); if (!n) return;
    const { error } = await sb.rpc('hq_set_seq', { n });
    setSaveState(error ? '⚠ Could not update the next quote number' : 'All changes saved');
  }, 600);
}

/* ---------- sign-in screens ---------- */
function centerCard(inner) {
  return `<div class="login-wrap"><div class="card login-card"><img src="${LOGO}" alt="Hetch Solutions" class="login-logo">${inner}</div></div>`;
}
function renderLogin(msg) {
  $('#app').innerHTML = centerCard(`<h2 style="margin:0 0 2px">Sign in</h2><div class="hint" style="margin-bottom:14px">Hetch Solutions quote system</div>
    <form id="loginForm" class="grid">
      <label class="f">Email<input type="email" id="lgEmail" autocomplete="username" required></label>
      <label class="f">Password<input type="password" id="lgPass" autocomplete="current-password" required></label>
      <div class="hint" id="lgMsg" style="color:var(--danger);min-height:1em">${esc(msg || '')}</div>
      <button class="btn primary" type="submit" id="lgBtn" style="justify-content:center">Sign in</button>
      <a href="#" id="lgForgot" style="font-size:13px;text-align:center">Forgot password?</a>
    </form>`);
  $('#lgEmail').focus();
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPass').value });
    if (error) {
      $('#lgMsg').textContent = /invalid login/i.test(error.message) ? 'Wrong email or password.' : error.message;
      btn.disabled = false; btn.textContent = 'Sign in'; return;
    }
    startSession(data.session);
  };
  $('#lgForgot').onclick = async e => {
    e.preventDefault();
    const email = $('#lgEmail').value.trim(), msgEl = $('#lgMsg');
    if (!email) { msgEl.textContent = 'Type your email above first.'; return; }
    await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    msgEl.style.color = 'var(--teal-ink)';
    msgEl.textContent = 'If that email has an account, a reset link is on its way.';
  };
}
function renderSetPassword() {
  $('#app').innerHTML = centerCard(`<h2 style="margin:0 0 12px">Choose a password</h2>
    <form id="pwForm" class="grid">
      <label class="f">New password (at least 8 characters)<input type="password" id="pw1" autocomplete="new-password" minlength="8" required></label>
      <label class="f">Repeat password<input type="password" id="pw2" autocomplete="new-password" minlength="8" required></label>
      <div class="hint" id="pwMsg" style="color:var(--danger);min-height:1em"></div>
      <button class="btn primary" type="submit" style="justify-content:center">Save password</button>
    </form>`);
  $('#pw1').focus();
  $('#pwForm').onsubmit = async e => {
    e.preventDefault();
    if ($('#pw1').value !== $('#pw2').value) { $('#pwMsg').textContent = "The passwords don't match."; return; }
    const { error } = await sb.auth.updateUser({ password: $('#pw1').value });
    if (error) { $('#pwMsg').textContent = error.message; return; }
    history.replaceState(null, '', location.pathname); recovering = false; toast('Password saved');
    const { data: { session } } = await sb.auth.getSession();
    if (session) startSession(session); else renderLogin();
  };
}
async function startSession(session) {
  userEmail = (session.user && session.user.email) || '';
  $('#app').innerHTML = centerCard('<p class="hint" style="text-align:center">Loading quotes…</p>');
  const { data: ok, error } = await sb.rpc('hq_is_staff');
  if (error || !ok) {
    $('#app').innerHTML = centerCard(`<h2 style="margin:0 0 8px">No access</h2><p class="hint">${esc(userEmail)} is signed in but is not on the staff list for the quote system.</p><button class="btn" data-act="signout">Sign out</button>`);
    return;
  }
  try { await loadCloud(); }
  catch (e) {
    console.error(e);
    $('#app').innerHTML = centerCard(`<h2 style="margin:0 0 8px">Can't load quotes</h2><p class="hint">Check your internet connection, then try again.</p><button class="btn primary" onclick="location.reload()">Try again</button>`);
    return;
  }
  view = { name: 'dash', id: null, tab: 'edit' }; render();
  startIdleWatch();
}
async function bootCloud() {
  const app = $('#app');
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || /YOUR-/.test(CFG.supabaseUrl + CFG.supabaseAnonKey)) {
    app.innerHTML = centerCard('<h2 style="margin:0 0 8px">Setup not finished</h2><p class="hint">The quote system is not connected to its database yet.</p>'); return;
  }
  app.innerHTML = centerCard('<p class="hint" style="text-align:center">Loading…</p>');
  const linkType = /type=(recovery|invite|signup)/.exec(location.hash);
  try { await loadScript(SB_LIB); }
  catch (e) { app.innerHTML = centerCard('<h2 style="margin:0 0 8px">Can\'t connect</h2><p class="hint">Check your internet connection and reload the page.</p>'); return; }
  // Security: the sign-in is kept in memory only, never saved in the browser,
  // so every page load (open, refresh, back button) asks for email and password.
  clearStoredSessions();
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; renderSetPassword(); }
    else if (event === 'SIGNED_OUT') { endSessionUI(); }
  });
  const { data: { session } } = await sb.auth.getSession();   // only set when arriving from a password-reset / invite link
  if (linkType && session) { recovering = true; renderSetPassword(); return; }
  if (recovering) return;
  renderLogin();
}
// remove any sign-in saved by earlier versions of the app
function clearStoredSessions() {
  try {
    for (const store of [localStorage, sessionStorage])
      Object.keys(store).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => store.removeItem(k));
  } catch (e) { /* storage blocked: nothing saved anyway */ }
}
// pages restored by the Back/Forward buttons come from memory; reload them so the login shows
window.addEventListener('pageshow', e => { if (CLOUD && e.persisted) location.reload(); });
async function signOut() {
  stopIdleWatch();
  if (state && (dirtyQuotes.size || dirtySettings || deletedQuotes.size)) await flushCloud();
  try { await sb.auth.signOut(); } catch (e) { console.error(e); }
  if (state) endSessionUI();   // make sure the screen is locked even if the server could not be reached
}
function endSessionUI() {
  stopIdleWatch(); closeModal();
  state = null; userEmail = ''; view = { name: 'dash', id: null, tab: 'edit' }; syncTitle();
  renderLogin(idleSignedOut ? 'You were signed out after 10 minutes of no activity.' : '');
  idleSignedOut = false;
}

/* ---------- auto sign-out after 10 minutes of no activity ---------- */
const IDLE_LIMIT = 10 * 60 * 1000, IDLE_WARN = 60 * 1000;
let lastActivity = Date.now(), idleTimer = null, idleWarnShown = false, idleSignedOut = false;
function noteActivity() {
  lastActivity = Date.now();
  if (idleWarnShown) { idleWarnShown = false; const w = $('#idleWarn'); if (w) w.remove(); }
}
['mousemove', 'mousedown', 'keydown', 'wheel', 'scroll', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, noteActivity, { passive: true, capture: true }));
function startIdleWatch() {
  if (!CLOUD) return;
  lastActivity = Date.now(); clearInterval(idleTimer); idleTimer = setInterval(checkIdle, 1000);
}
function stopIdleWatch() {
  clearInterval(idleTimer); idleTimer = null;
  idleWarnShown = false; const w = $('#idleWarn'); if (w) w.remove();
}
function checkIdle() {
  if (!state) return stopIdleWatch();
  const left = IDLE_LIMIT - (Date.now() - lastActivity);   // also catches a PC waking from sleep
  if (left <= 0) { idleSignedOut = true; signOut(); return; }
  if (left <= IDLE_WARN) {
    let w = $('#idleWarn');
    if (!w) {
      w = document.createElement('div'); w.id = 'idleWarn'; w.className = 'idle-warn'; w.setAttribute('role', 'alert');
      document.body.appendChild(w);
    }
    idleWarnShown = true;
    w.textContent = `No activity: you'll be signed out in ${Math.ceil(left / 1000)} seconds. Move the mouse or press any key to stay signed in.`;
  }
}

/* ---------- boot ---------- */
if (CLOUD) bootCloud();
else { state = load(); save(true); render(); }
</script>
